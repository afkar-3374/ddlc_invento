<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="pwaGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#168653" />
      <stop offset="50%" stop-color="#126E43" />
      <stop offset="100%" stop-color="#0E5434" />
    </linearGradient>
    <linearGradient id="boxGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E5F5E9" />
      <stop offset="100%" stop-color="#B9F2D0" />
    </linearGradient>
  </defs>
  <!-- Background with rounded squircles -->
  <rect width="512" height="512" rx="128" fill="url(#pwaGrad)" />
  <!-- Subtle inner glow border -->
  <rect x="16" y="16" width="480" height="480" rx="112" fill="none" stroke="#B9F2D0" stroke-width="4" stroke-opacity="0.3" />
  <!-- Central Icon: Futuristic Inventory Cube & Barcode lines -->
  <g transform="translate(106, 96)">
    <!-- Main 3D Box in Isometric Style -->
    <path d="M150 20 L270 90 L150 160 L30 90 Z" fill="url(#boxGrad)" />
    <path d="M30 90 L150 160 L150 280 L30 210 Z" fill="#9AE3B6" />
    <path d="M270 90 L150 160 L150 280 L270 210 Z" fill="#71D498" />
    <!-- Barcode Stripes on front face -->
    <rect x="55" y="135" width="8" height="50" rx="4" fill="#168653" transform="skewY(30)" />
    <rect x="73" y="125" width="14" height="50" rx="4" fill="#168653" transform="skewY(30)" />
    <rect x="97" y="111" width="6" height="50" rx="3" fill="#168653" transform="skewY(30)" />
    <rect x="113" y="102" width="12" height="50" rx="4" fill="#168653" transform="skewY(30)" />
    <!-- AI Sparkle star top right -->
    <path d="M250 15 Q250 45 280 45 Q250 45 250 75 Q250 45 220 45 Q250 45 250 15 Z" fill="#FFE3EF" />
    <circle cx="280" cy="20" r="4" fill="#FFE3EF" />
  </g>
</svg>
