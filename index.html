    <script>
      // Suppress Vite HMR WebSocket closed notices and platform-specific mock errors
      (function() {
        const OriginalWebSocket = window.WebSocket;
        
        // Comprehensive WebSocket mock to silence Vite HMR in restricted environments
        function MockWebSocket(url, protocols) {
          if (typeof url === 'string' && (url.includes('vite') || url.includes('hmr') || url.includes('3000'))) {
            // Silently mock Vite/HMR connections
            this.url = url;
            this.readyState = 0; // CONNECTING
            this.send = () => {};
            this.close = () => { this.readyState = 3; };
            this.addEventListener = () => {};
            this.removeEventListener = () => {};
            this.dispatchEvent = () => true;
            
            // Transition to OPEN state immediately to satisfy clients, 
            // but don't actually do anything.
            setTimeout(() => {
              this.readyState = 1; // OPEN
              if (this.onopen) this.onopen({ type: 'open' });
            }, 0);
            
            return this;
          }
          return new OriginalWebSocket(url, protocols);
        }
        
        MockWebSocket.prototype = OriginalWebSocket.prototype;
        window.WebSocket = MockWebSocket;

        const _origError = console.error;
        const _origWarn = console.warn;
        const _origLog = console.log;
        
        function shouldSuppress(arg) {
          if (!arg) return false;
          const str = (typeof arg === 'string') ? arg : ((arg.message || '') + ' ' + (arg.stack || ''));
          return (
            str.indexOf('WebSocket') !== -1 ||
            str.indexOf('vite') !== -1 ||
            str.indexOf('HMR') !== -1 ||
            str.indexOf('Illegal invocation') !== -1 ||
            str.indexOf('failed to connect') !== -1 ||
            str.indexOf('closed without opened') !== -1 ||
            str.indexOf('net::ERR_CONNECTION_REFUSED') !== -1 ||
            str.indexOf('ws://') !== -1 ||
            str.indexOf('wss://') !== -1
          );
        }

        console.error = function() {
          if (Array.from(arguments).some(shouldSuppress)) return;
          return _origError.apply(console, arguments);
        };

        console.warn = function() {
          if (Array.from(arguments).some(shouldSuppress)) return;
          return _origWarn.apply(console, arguments);
        };

        // Also suppress logs that might be noisy from HMR
        console.log = function() {
          if (Array.from(arguments).some(shouldSuppress)) return;
          return _origLog.apply(console, arguments);
        };

        window.addEventListener('error', function(e) {
          const msg = (e && (e.message || (e.error && (e.error.message || e.error.stack)))) || '';
          if (shouldSuppress(msg)) {
            e.stopImmediatePropagation();
            if (e.preventDefault) e.preventDefault();
            return true;
          }
        }, true);

        // Intercept any unhandled errors from @vite/client
        const originalAddEventListener = window.addEventListener;
        window.addEventListener = function(type, listener, options) {
          if (type === 'error' || type === 'unhandledrejection') {
            const wrappedListener = function(e) {
              const msg = (e && (e.message || (e.reason && (e.reason.message || e.reason.stack)))) || '';
              if (shouldSuppress(msg)) {
                if (e.stopImmediatePropagation) e.stopImmediatePropagation();
                if (e.preventDefault) e.preventDefault();
                return;
              }
              return listener.apply(this, arguments);
            };
            return originalAddEventListener.call(window, type, wrappedListener, options);
          }
          return originalAddEventListener.call(window, type, listener, options);
        };
      })();

      // Ensure trailing slash on GitHub Pages directory URLs so relative assets (./assets/...) resolve correctly
      if (window.location.pathname.length > 1 && !window.location.pathname.endsWith('/') && !window.location.pathname.includes('.')) {
        window.location.replace(window.location.pathname + '/' + window.location.search + window.location.hash);
      }
      (function(l) {
        if (l.search && l.search[1] === '/' ) {
          var decoded = l.search.slice(1).split('&').map(function(s) { 
            return s.replace(/~and~/g, '&');
          }).join('?');
          window.history.replaceState(null, null,
            l.pathname.slice(0, -1) + decoded + l.hash
          );
        }
      }(window.location));
    </script>
